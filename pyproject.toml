[project]
name = "reelucid"
version = "1.0.1"
description = "Local-first media transcription and evidence-backed understanding service"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "pydantic>=2.14.3,<3",
  "faster-whisper>=1.2.1,<2",
  "ctranslate2>=4.9,<5",
  "onnxruntime>=1.31.1,<2",
  "numpy>=2,<3",
  "huggingface-hub>=2.4.0,<3",
  "filelock>=4.2.10",
  "httpx2>=2.16.0,<3",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.165.0,<0.166", "uvicorn>=0.54,<0.55", "sqlalchemy>=2.1.8,<2.2",
  "alembic>=1.20.1,<2", "aiohttp>=3.14.5,<4", "python-multipart>=0.0.20",
  "cryptography>=44", "itsdangerous>=2.2", "psutil>=7",
  "yt-dlp[default]>=2026.10.26",
]

[project.scripts]
reelucid = "reelucid.cli:main"

[build-system]
requires = ["uv_build==0.13.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4,<0.18",
    "pyright>=1.1.414,<2",
    "pytest>=9.2,<10",
    "pytest-asyncio>=1",
    "types-psutil>=7",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["model: real local model inference", "network: external network", "gpu: GPU runtime", "slow: long media/capacity"]
