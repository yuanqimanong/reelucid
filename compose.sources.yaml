services:
  xhs-resolver:
    profiles: [xhs]
    image: joeanamier/xhs-downloader:2.8@sha256:5878c0972cc1236cd8ac4e069f9202152434d8402df52bf427210229b8a53fb9
    command: [python, main.py, api]
    volumes:
      - xhs-resolver-data:/app/Volume
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5556/openapi.json', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
volumes:
  xhs-resolver-data:
