name: checks
on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --locked --extra server
      - run: uv lock --check
      - run: uv run --locked --extra server ruff check src tests
      - run: uv run --locked --extra server ruff format --check src tests
      - run: uv run --locked --extra server pyright
      - run: uv run --locked --extra server pytest -m 'not model and not network and not gpu and not slow'
      - name: Export OpenAPI
        run: |
          uv run --locked --extra server python - <<'PY'
          import json
          from pathlib import Path

          from reelucid.api import create_app

          schema = json.dumps(create_app().openapi(), ensure_ascii=False, indent=2)
          Path("docs/openapi.json").write_text(schema + "\n", encoding="utf-8", newline="\n")
          PY
      - run: git diff --exit-code -- docs/openapi.json
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
  container:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
  publish:
    name: Publish to Docker Hub
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [python, web]
    runs-on: ubuntu-latest
    env:
      REELUCID_IMAGE: reelucid:release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check release version
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as project:
              version = tomllib.load(project)["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag} must match pyproject.toml version {version}")
          PY
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ env.REELUCID_IMAGE }}
          load: true
          cache-from: type=gha
      - name: Start and check release container
        run: docker compose up -d --no-build --pull never --wait --wait-timeout 150 reelucid
      - name: Print release container logs
        if: failure()
        run: docker compose logs --no-color reelucid
      - name: Push versioned image
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          : "${DOCKERHUB_USERNAME:?Set the DOCKERHUB_USERNAME Actions variable}"
          : "${DOCKERHUB_TOKEN:?Set the DOCKERHUB_TOKEN Actions secret}"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          image="docker.io/${DOCKERHUB_USERNAME}/reelucid:${VERSION}"
          docker tag "$REELUCID_IMAGE" "$image"
          docker push "$image"
