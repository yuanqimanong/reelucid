name: checks
on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --locked --extra server
      - run: uv lock --check
      - run: uv run --locked --extra server python scripts/check_release_version.py
      - run: uv run --locked --extra server ruff check src tests
      - run: uv run --locked --extra server ruff format --check src tests
      - run: uv run --locked --extra server pyright
      - run: uv run --locked --extra server pytest -m 'not model and not network and not gpu and not slow'
      - name: Export OpenAPI
        run: |
          uv run --locked --extra server python - <<'PY'
          import json
          from pathlib import Path

          from reelucid.api import create_app

          schema = json.dumps(create_app().openapi(), ensure_ascii=False, indent=2)
          Path("docs/openapi.json").write_text(schema + "\n", encoding="utf-8", newline="\n")
          PY
      - run: git diff --exit-code -- docs/openapi.json
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
  container:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: reelucid:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify candidate image over HTTP
        run: bash scripts/smoke_release_image.sh reelucid:ci never
  publish:
    name: Publish to Docker Hub
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [python, web]
    concurrency:
      group: dockerhub-reelucid-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      REELUCID_IMAGE: reelucid:release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check release version
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/check_release_version.py --tag "$RELEASE_TAG"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ env.REELUCID_IMAGE }}
          load: true
          cache-from: type=gha
      - name: Verify release image over HTTP before pushing
        run: bash scripts/smoke_release_image.sh "$REELUCID_IMAGE" never
      - name: Push versioned image
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          : "${DOCKERHUB_USERNAME:?Set the DOCKERHUB_USERNAME Actions variable}"
          : "${DOCKERHUB_TOKEN:?Set the DOCKERHUB_TOKEN Actions secret}"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          image="docker.io/${DOCKERHUB_USERNAME}/reelucid:${VERSION}"
          docker tag "$REELUCID_IMAGE" "$image"
          repository="${DOCKERHUB_USERNAME}/reelucid"
          pull_token="$(curl -fsS --user "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" \
            --get --data-urlencode 'service=registry.docker.io' \
            --data-urlencode "scope=repository:$repository:pull" \
            https://auth.docker.io/token | jq -er '.token | select(type == "string" and length > 0)')"
          manifest="$RUNNER_TEMP/reelucid-manifest.json"
          status="$(curl -sS -o "$manifest" -w '%{http_code}' \
            -H "Authorization: Bearer $pull_token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://registry-1.docker.io/v2/$repository/manifests/$VERSION")"
          if [[ "$status" != 404 ]] || ! jq -e 'any(.errors[]?; .code == "MANIFEST_UNKNOWN")' "$manifest" >/dev/null; then
            echo "Refusing to push $image: missing manifest not confirmed (HTTP $status)." >&2
            exit 1
          fi
          docker push "$image"
      - name: Verify published image over HTTP
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          bash scripts/smoke_release_image.sh "docker.io/${DOCKERHUB_USERNAME}/reelucid:${VERSION}" always
      - name: Logout from Docker Hub
        if: always()
        run: docker logout
